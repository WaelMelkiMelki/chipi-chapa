      Reveal.initialize({
        hash: true,
        slideNumber: 'c/t',
        progress: true,
        controls: true,
        transition: 'slide',
        width: 1280,
        height: 720,
        margin: 0.05,
        // Order matters: Markdown must precede Mermaid so diagrams embedded
        // in .md files exist in the DOM before the Mermaid plugin renders them.
        plugins: [
          RevealMarkdown,
          RevealNotes,
          RevealHighlight,
          RevealMath.KaTeX,
          RevealSearch,
          RevealZoom,
          RevealMenu,
